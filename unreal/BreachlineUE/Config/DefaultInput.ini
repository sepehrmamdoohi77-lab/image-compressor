; ============================================================================
;  BREACHLINE UE — DefaultInput.ini
;  Legacy mappings are deliberately empty: everything is Enhanced Input
;  (Content/Breachline/Input is generated by Content/Python/breachline_assets.py).
; ============================================================================

[/Script/Engine.InputSettings]
bAltEnterTogglesFullscreen=True
bUseMouseForTouch=False
bEnableGestureRecognizer=False
bUseSteamController=False
DefaultTouchInterface=None
bEnableMouseSmoothing=False

; Modifier/trigger defaults live on the Input Actions themselves; the binding
; map (IMC_Breachline) is the single source of truth for controls.
;
;   WASD / Gamepad LS ....... IMC_Breachline > IA_Move
;   Mouse XY ................ IA_Aim (world-space cursor aim)
;   LMB ..................... IA_Fire
;   RMB (hold) .............. IA_PrecisionAim
;   Shift (hold) ............ IA_Sprint
;   C / Ctrl (hold) ......... IA_Crouch
;   R ....................... IA_Reload
;   G ....................... IA_Grenade
;   1..5 / Tab / Wheel ...... IA_WeaponSlot, IA_CycleWeapon, IA_Zoom
;   Q / E ................... IA_RotateCamera
;   Esc ..................... IA_Pause
