; ============================================================================
;  BREACHLINE UE — DefaultEngine.ini
;  Target: Unreal Engine 5.8, desktop high-end (DX12 / SM6, Vulkan optional).
;
;  Art direction is DUSK URBAN COMPOUND: warm low sun, cool blue shadows,
;  heavy atmospheric haze, wet asphalt. Everything below exists to serve that
;  look while keeping a stable frame time.
; ============================================================================

[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Game/Breachline/Maps/L_Breachline.L_Breachline
; The map is generated by Content/Python/breachline_level.py. Until it exists,
; any empty level works: ABreachlineGameMode builds the compound at runtime.
; The editor opens an engine template level so a fresh clone always has something to
; load; the game mode builds the whole compound at runtime. GameDefaultMap (above)
; is the shipped map, created by Content/Python/breachline_level.py.
EditorStartupMap=/Engine/Maps/Templates/Template_Default.Template_Default
GlobalDefaultGameMode=/Script/BreachlineUE.BreachlineGameMode

[/Script/Engine.Engine]
+ActiveGameNameRedirects=(OldGameName="TP_Blank",NewGameName="/Script/BreachlineUE")

; ----------------------------------------------------------------------------
;  Rendering — "high graphics" baseline. Project Settings > Rendering mirrors
;  these; they are ini-first so the look survives project resets.
; ----------------------------------------------------------------------------
[/Script/Engine.RendererSettings]
r.DefaultFeature.AntiAliasing=4                 ; 4 = TSR (Temporal Super Resolution)
r.TemporalAA.Upsampling=True
r.ScreenPercentage=100
r.SuperResolution.Enable=True
r.DefaultFeature.MotionBlur=False               ; tactical clarity: no smearing
r.DefaultFeature.AutoExposure=False             ; fixed exposure = readable at dusk
r.DefaultFeature.AutoExposure.Method=0
r.DefaultFeature.Bloom=True
r.Bloom.Quality=5
r.DefaultFeature.AmbientOcclusion=True
r.DefaultFeature.AmbientOcclusionStaticFraction=True
r.DefaultFeature.LensFlare=True
r.LensFlareQuality=2
r.DefaultFeature.LightUnits=1                   ; physical light units (lux)

; Lumen: full dynamic GI + reflections. HW ray tracing when the GPU allows it,
; software tracing otherwise (no lightmap bake anywhere in this project).
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Lumen.HardwareRayTracing=True
r.Lumen.HardwareRayTracing.LightingMode=1
r.Lumen.HardwareRayTracing.Reflections=1
r.Lumen.TraceMeshSDFs=1
r.Lumen.ScreenProbeGather.RadianceCache=1
r.Lumen.TranslucencyReflections.FrontLayer.EnableForProject=True
r.LumenScene.DirectLighting=1
r.LumenScene.Radiosity=1
r.LumenScene.FarField=1

; MegaLights (production-ready in 5.8): many shadow-casting local lights —
; the compound's lamp posts, muzzle flashes and explosions all cast real
; shadows without a light-count budget fight.
r.MegaLights.EnableForProject=True
r.MegaLights.ShadowMethod=1

; Substrate materials: layered urban surfaces (wet asphalt over aggregate,
; rust over painted steel) authored with the Substrate node graph.
r.Substrate=True
r.Substrate.BytesPerPixel=1
r.Substrate.ClosuresPerPixel=2

; Shadows: virtual shadow maps, high-res, with the sun's cascade kept tight.
r.Shadow.Virtual.Enable=1
r.Shadow.Virtual.ResolutionLodBiasDirectional=-0.5
r.Shadow.Virtual.SMRT.RayCountDirectional=8
r.Shadow.Virtual.SMRT.SamplesPerRayDirectional=2
r.Shadow.MaxCSMResolution=4096
r.Shadow.DistanceScale=1.4
r.Shadow.CSM.MaxCascades=4

; Nanite: everything structural (walls, buildings, props) is Nanite — no LOD
; authoring, no popped silhouettes. Foliage uses the 5.8 PVE pipeline.
r.Nanite.ProjectEnabled=True
r.Nanite.ProxyRenderMode=0

; Atmosphere / volumetrics for the haze that sells the dusk lighting.
r.VolumetricFog=1
r.VolumetricFog.GridPixelSize=8
r.VolumetricFog.GridSizeZ=128
r.VolumetricCloud=1
r.SkyAtmosphere=1
r.Fog.ScreenSpaceScattering=1                 ; 5.8 experimental FSSS — soft haze
r.SSGI.Enable=0                               ; superseded by Lumen

; Geometry streaming for the larger 5.8-era maps (no-op on the small arena).
r.AllowStaticLighting=False
r.GenerateMeshDistanceFields=True
r.DistanceFieldAO=1
r.MeshStreaming=True

; Frame pacing: 120 fps budget on high-end, uncapped in editor.
[/Script/Engine.RendererOverrideSettings]
bSupportAllShaderPermutations=False

[/Script/Engine.GarbageCollectionSettings]
gc.MaxObjectsInEditor=25165824
gc.TimeBetweenPurgingPendingKillObjects=60
gc.FlushStreamingOnGC=1

; ----------------------------------------------------------------------------
;  Input — Enhanced Input is the only input path (no legacy axis mappings).
; ----------------------------------------------------------------------------
[/Script/Engine.InputSettings]
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent
bEnableMouseSmoothing=False
bViewAccelerationEnabled=False
DefaultViewportMouseCaptureMode=CapturePermanently_IncludingInitialMouseDown
DefaultViewportMouseLockMode=LockOnCapture

; ----------------------------------------------------------------------------
;  Physics — the arena is static geometry; only ragdolls/debris simulate.
; ----------------------------------------------------------------------------
[/Script/Engine.PhysicsSettings]
DefaultGravityZ=-980.000000
bSubstepping=True
MaxSubstepDeltaTime=0.016667

; ----------------------------------------------------------------------------
;  Navigation — runtime-generated navmesh (the compound is built at runtime, so
;  there is nothing to bake in the editor).
; ----------------------------------------------------------------------------
[/Script/NavigationSystem.NavigationSystemV1]
bAutoCreateNavigationData=True
bSpawnNavDataInNavBoundsLevel=True

[/Script/NavigationSystem.RecastNavMesh]
RuntimeGeneration=Dynamic
CellSize=19.000000
CellHeight=10.000000
AgentRadius=42.000000
AgentHeight=192.000000
AgentMaxSlope=44.000000
AgentMaxStepHeight=45.000000
TileSizeUU=1200.000000
bDrawPolyEdges=False
bDistinctlyDrawTilesBeingBuilt=False

; ----------------------------------------------------------------------------
;  Collision channels
;   ECC_GameTraceChannel1 = Weapon  (bullet traces: ignore soft foliage)
;   ECC_GameTraceChannel2 = Cover   (cover volumes the AI scores against)
; ----------------------------------------------------------------------------
[/Script/Engine.CollisionProfile]
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel1,DefaultResponse=ECR_Block,bTraceType=True,bStaticObject=False,Name="Weapon")
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel2,DefaultResponse=ECR_Block,bTraceType=True,bStaticObject=False,Name="Cover")

+Profiles=(Name="BreachlineCharacter",CollisionEnabled=QueryAndPhysics,ObjectTypeName="Pawn",CustomResponses=((Channel="Visibility",Response=ECR_Block),(Channel="Camera",Response=ECR_Ignore),(Channel="Weapon",Response=ECR_Block)),HelpMessage="Player and enemy bodies: bullets resolve hit zones, camera ignores them.")
+Profiles=(Name="BreachlineCover",CollisionEnabled=QueryAndPhysics,ObjectTypeName="WorldStatic",CustomResponses=((Channel="Weapon",Response=ECR_Block),(Channel="Cover",Response=ECR_Block),(Channel="Visibility",Response=ECR_Block)),HelpMessage="Cover geometry: blocks bullets, sight and movement.")

; ----------------------------------------------------------------------------
;  Audio — 48 kHz, synth components mixed on the Master bus.
; ----------------------------------------------------------------------------
[/Script/AudioMixer.AudioMixerSettings]
SampleRate=48000
NumSourceWorkers=4

[/Script/AudioSettings.AudioSettings]
DefaultSoundClassName=/Engine/EngineSounds/Master.Master
DefaultReverbSendLevel=0.0
